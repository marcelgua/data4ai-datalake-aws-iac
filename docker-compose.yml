# =============================================================================
# docker-compose.yml — LocalStack for local development
# =============================================================================
# Emulates the AWS APIs the Terraform configuration targets locally:
#   S3 (staging bucket), EC2 (Airbyte host), IAM (instance profile), STS.
# Usage: docker compose up -d   (or scripts/local-up.sh for the full flow)
# =============================================================================

services:
  localstack:
    image: localstack/localstack:3.5
    container_name: data4ai-localstack
    ports:
      - "4566:4566"
    environment:
      # AWS services to activate locally.
      SERVICES: s3,ec2,iam,sts
      DEBUG: ${DEBUG:-0}
      # Allow LocalStack to spawn sibling containers when needed (e.g. for
      # compute backends); harmless for the mocked EC2 used here.
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  localstack-data:
    driver: local
